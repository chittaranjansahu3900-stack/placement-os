# Firebase App Hosting config (Cloud Run-based; this is Google's current
# first-class Next.js hosting product, not the older static-export "Firebase
# Hosting"). Written by hand — connecting a real backend needs an
# interactive `firebase login` + GitHub App install through the Firebase
# Console, which isn't something a non-interactive session can do. See the
# README's "Hosting" section for the manual setup steps and the actual
# risk this config doesn't cover (proxy.ts support is unverified).
#
# NEXT_PUBLIC_* values are inlined into the client bundle at `next build`
# time, so they need BUILD availability, not just RUNTIME.

env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: "https://styqkekxmyjupanwdxid.supabase.co"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_INSTITUTE_SLUG
    value: "iim-raipur"
    availability:
      - BUILD
      - RUNTIME

  # Recruiter signup provisions auth and application records before a user
  # session exists, so it requires the server-only Supabase service role.
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  # Server-side notification controls. Keep sending disabled until CDPO signs
  # off the wording in src/lib/notifications/templates.ts and Resend verifies
  # the sending domain. Changing the sender later is configuration-only.
  - variable: RESEND_FROM_EMAIL
    value: "PlacementOS Notifications <notifications@mail.iitiimcareers.in>"
    availability:
      - RUNTIME

  - variable: NOTIFICATIONS_SEND_ENABLED
    value: "false"
    availability:
      - RUNTIME

  # Admin kill switch for the Resume Maker provider proxy. Provider keys are
  # Secret Manager values and must never use NEXT_PUBLIC_* names.
  - variable: RESUME_AI_ENABLED
    value: "false"
    availability:
      - RUNTIME

  - variable: GROQ_MODEL
    value: "llama-3.3-70b-versatile"
    availability:
      - RUNTIME

  - variable: GEMINI_MODEL
    value: "gemini-2.5-flash"
    availability:
      - RUNTIME

  - variable: ANTHROPIC_MODEL
    value: "claude-sonnet-5"
    availability:
      - RUNTIME

# Configure NEXT_PUBLIC_SUPABASE_ANON_KEY in the App Hosting backend's
# Environment settings. Add RESEND_API_KEY, RESEND_WEBHOOK_SECRET,
# NOTIFICATION_CRON_SECRET, GROQ_API_KEY, GEMINI_API_KEY, and
# ANTHROPIC_API_KEY here as `secret` references only after creating them with
# Firebase/Secret Manager.
